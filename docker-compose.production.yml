name: passaporte-virtual-prod

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ${API_IMAGE:-ghcr.io/morea-ifs/passaporte-api:latest}
    pull_policy: always
    restart: unless-stopped
    env_file:
      - ./apps/api/.env.production
    command: sh -c "node ace migration:run --force && node ace db:seed && node bin/server.js"
    ports:
      - '${API_PORT:-3333}:3333'
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: ${WEB_IMAGE:-ghcr.io/morea-ifs/passaporte-web:latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      API_URL: http://api:3333
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:?}
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      - api

volumes:
  postgres_data:

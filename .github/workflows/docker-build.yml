name: Build das imagens Docker

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    name: Imagem de produção (${{ matrix.app }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [api, web]

    steps:
      - name: Obter código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Compilar imagem de produção
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          target: prod
          platforms: linux/amd64
          tags: passaporte-${{ matrix.app }}:ci
          load: true
          push: false
          cache-from: type=gha,scope=passaporte-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=passaporte-${{ matrix.app }}

      - name: Confirmar que a imagem foi gerada
        env:
          IMAGE: passaporte-${{ matrix.app }}:ci
        run: docker image inspect "$IMAGE" --format '{{.Id}}'
